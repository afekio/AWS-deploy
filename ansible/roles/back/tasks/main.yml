---
- name: Install Python3, pip, and venv
  apt:
    name:
      - python3
      - python3-pip
      - python3-venv
    state: present
    update_cache: yes

- name: Create application directory
  file:
    path: "{{ app_dir }}"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0755'


- name: Copy Back project files
  copy:
    src: Backend/
    dest: "{{ app_dir }}/"
    owner: ubuntu
    group: ubuntu

- name: Install python packages from requirements.txt
  pip:
    requirements: "{{ app_dir }}/requirements.txt"
    virtualenv: "{{ app_dir }}/venv"
    virtualenv_command: python3 -m venv

- name: Create .env file for environment variables
  template:
    src: .env.j2
    dest: "{{ app_dir }}/.env"
    owner: ubuntu
    mode: '0600'
  notify: Restart Back App
  tags:
    - env


- name: Create Systemd service for the Back app
  template:
    src: back.service.j2
    dest: /etc/systemd/system/back.service
  notify: Restart Back App
  tags:
    - service

- name: Ensure Back app is running and enabled
  systemd:
    name: back
    state: started
    enabled: yes
    daemon_reload: yes
  tags:
    - service